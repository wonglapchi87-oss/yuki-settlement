<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Yuki · Settlement</title><style>
:root{--bg:#fff8f0;--ink:#2d2a26;--acc:#d9622b;--card:#fff;--mut:#7a6f66}
*{box-sizing:border-box}body{margin:0;font:18px/1.55 -apple-system,system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
#app{max-width:720px;margin:auto;padding:0 16px 60px}
.gate{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.gate input{font-size:22px;padding:14px;border-radius:14px;border:2px solid #e3d3c4;width:100%;max-width:320px;text-align:center}
.gate button,.btn{margin-top:14px;font-size:20px;padding:14px 30px;border:0;border-radius:14px;background:var(--acc);color:#fff;font-weight:700}
.err{color:#b00020;min-height:1.5em;margin-top:8px}
.hero{background:linear-gradient(135deg,#f6a560,#d9622b);color:#fff;border-radius:0 0 24px 24px;margin:0 -16px;padding:26px 20px}
.hero h1{margin:6px 0 0;font-size:30px}.hero p{margin:0;opacity:.9}.tag{font-size:13px;opacity:.85;text-transform:uppercase;letter-spacing:1px}
.cd{display:flex;gap:10px;margin-top:16px}.c{flex:1;background:rgba(255,255,255,.2);border-radius:16px;padding:12px;text-align:center}
.c b{display:block;font-size:28px}.c span{font-size:14px}
nav{display:flex;gap:8px;overflow-x:auto;padding:14px 0;position:sticky;top:0;background:var(--bg);z-index:2}
nav a{white-space:nowrap;background:#fff;border:1px solid #eedccc;border-radius:20px;padding:6px 14px;color:var(--ink);text-decoration:none;font-size:15px}
h2{font-size:24px;margin:28px 0 10px}h3{margin:6px 0}
.warn{background:#fff1d6;border-left:6px solid #f0a020;border-radius:12px;padding:12px 14px;font-size:16px}
.ok{background:#e5f6e9;border-radius:12px;padding:12px;font-weight:600}
.step{background:var(--card);border-radius:18px;padding:14px 16px;margin:12px 0;border-left:6px solid #e3d3c4;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.step.done{opacity:.7;border-color:#5aa66a}.step.now{border-color:var(--acc)}.step.key{border-color:#2b6fd9}
.d{font-size:14px;font-weight:700;color:var(--acc)}.step ul{padding-left:20px;margin:6px 0}.step li{margin:6px 0}
.exp{background:#f7f1ea;border-radius:10px;padding:8px 10px;font-size:15px;color:var(--mut)}
.w{display:inline-block;font-size:12px;font-weight:700;border-radius:8px;padding:1px 7px;margin-right:4px;vertical-align:middle}
.you{background:#ffe0cc;color:#a3410f}.sa{background:#dbe8ff;color:#1c4fa0}.se{background:#e8e0f7;color:#5b3a99}
.legend{margin:12px 0}
.card{display:block;background:#fff;border-radius:16px;padding:14px 16px;margin:10px 0;color:var(--ink);text-decoration:none;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.card span{display:block;font-size:20px;margin-top:4px}.call span{color:var(--acc);font-weight:700}
.tbc{color:#b0784a;font-style:italic}table{width:100%;background:#fff;border-radius:16px;border-collapse:collapse;overflow:hidden}
td{padding:10px 14px;border-bottom:1px solid #f1e6dc}td:first-child{color:var(--mut);width:45%}
ol.big li{margin:10px 0}.small{font-size:14px;color:var(--mut)}a{color:var(--acc)}
</style></head><body>
